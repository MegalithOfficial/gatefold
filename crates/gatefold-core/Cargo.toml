[package]
name = "gatefold-core"
description = "Session, auth, and playback for Gatefold. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
romanization = ["dep:deunicode", "dep:kakasi", "dep:unicode-script"]

[dependencies]
librespot = "0.8"
nucleo-matcher = "0.3.1"
oauth2 = "5"
open = "5"

futures = "0.3"
http = "1"
protobuf = "3"
quick-xml = "0.38"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
kakasi = { version = "0.1", optional = true }
deunicode = { version = "1.6", optional = true }
unicode-script = { version = "0.5", optional = true }
rand = "0.10"
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
dirs = "6.0.0"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tracing-subscriber.workspace = true
