[package]
name = "gatefold"
description = "A native Spotify client for Linux, designed around the album art."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[build-dependencies]
glib-build-tools = "0.22"

[dependencies]
gatefold-core = { path = "../gatefold-core", features = ["romanization"] }

anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_50"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", features = ["tokio"] }
